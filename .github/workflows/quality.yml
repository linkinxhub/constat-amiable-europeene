name: Accordia quality and security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accordia-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build, tests and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      SITES_PNPM_SHARED_STORE: .sites-runtime/pnpm-store
    steps:
      # Official actions pinned to reviewed release commits, not mutable tags.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, 2026-07-16
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, 2026-07-14
        with:
          node-version: '24.22.1'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
      - name: Install frozen dependencies with the project release-age policy
        run: pnpm install --frozen-lockfile
      - name: TypeScript, ESLint, build, then tests
        run: pnpm verify
      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=low
      # No advisory is ignored. The documented development Minimatch advisory
      # currently makes this final step fail until a compatible fix is eligible.
      - name: Audit all dependencies (blocking, including development)
        run: pnpm audit --audit-level=low
