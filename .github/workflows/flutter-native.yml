name: Accordia native project checks
on:
  push:
    paths:
      - 'mobile/accordia_native/**'
      - '.github/workflows/flutter-native.yml'
  pull_request:
    paths:
      - 'mobile/accordia_native/**'
      - '.github/workflows/flutter-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ACCORDIA_REFERENCE_PDFS: ${{ runner.temp }}/accordia-native-review/pdfs
      ACCORDIA_INPUT_PREVIEWS: ${{ runner.temp }}/accordia-native-review/previews
    defaults:
      run:
        working-directory: mobile/accordia_native
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install checksum-verified official Flutter 3.47.9
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz
          printf '%s  %s\n' '25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a' "$RUNNER_TEMP/flutter.tar.xz" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter --no-version-check --suppress-analytics pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter --no-version-check --suppress-analytics analyze
      - name: Test
        run: flutter --no-version-check --suppress-analytics test --reporter expanded
      - name: Keep native PDF and input review outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Accordia-Native-Review
          path: ${{ runner.temp }}/accordia-native-review/
          if-no-files-found: error
          retention-days: 7
      - name: Build Android test APK
        run: flutter --no-version-check --suppress-analytics build apk --debug --target-platform android-arm64
      - name: Keep Android test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Accordia-Native-Pages-test
          path: mobile/accordia_native/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
